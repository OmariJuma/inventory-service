services:
  postgres:
    image: postgres:latest
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inventory_service
    ports:
      - "5434:5432"
    volumes:
      - ./data:/data/db
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql